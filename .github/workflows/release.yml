name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional signing: configure the three secrets to produce signed
      # artifacts; without them the build is unsigned (see docs/RELEASE.md).
      - name: Prepare signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$RELEASE_KEYSTORE_PASSWORD"
              echo "keyAlias=$RELEASE_KEY_ALIAS"
              echo "keyPassword=$RELEASE_KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "Signing configured."
          else
            echo "No signing secrets; building unsigned artifacts."
          fi

      - name: Run checks
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug

      - name: Build APK and App Bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
